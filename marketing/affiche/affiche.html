<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Affiche Le QG</title>
<!--
  Affiche « Le QG est en ligne » aux couleurs du site.
  ?format=post  → 1080 × 1350 (Instagram / WhatsApp, par défaut)
  ?format=story → 1080 × 1920 (statut WhatsApp, story Instagram)
  ?format=og    → 1200 × 630  (aperçu du lien sur WhatsApp, Facebook, Google : public/og/og-default.jpg)
  Export PNG : npm run affiche (voir marketing/affiche/export.mjs)
-->
<style>
  @font-face { font-family: "Fredoka"; src: url("../../app/fonts/fredoka-700-latin.woff2") format("woff2"); font-weight: 700; }
  @font-face { font-family: "Inter"; src: url("../../app/fonts/inter-variable-latin.woff2") format("woff2"); font-weight: 100 900; }
  :root {
    --cream: #fcefda; --sand: #fde0af; --orange: #e76117; --deep: #b04a0e;
    --sunset: #f39a3a; --brown: #31160a; --brown2: #5a2e17; --night: #1e0e06;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--night); }
  .poster {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    font-family: "Inter", sans-serif; color: var(--brown);
    background:
      radial-gradient(circle at 78% 30%, rgb(255 214 140 / .55) 0 120px, transparent 260px),
      linear-gradient(180deg, #f6a24a 0%, var(--orange) 46%, var(--deep) 100%);
  }
  .story .poster { height: 1920px; }

  /* Guirlande */
  .lights { position: absolute; top: 0; left: 0; width: 100%; height: 150px; }

  /* En-tête */
  .head { position: absolute; top: 112px; left: 72px; right: 72px; display: flex; align-items: flex-end; justify-content: space-between; }
  .wordmark { width: 330px; filter: drop-shadow(0 6px 0 rgb(49 22 10 / .18)); }
  .live {
    font-family: "Fredoka"; font-size: 30px; color: var(--cream); background: var(--brown);
    padding: 14px 26px 12px; border-radius: 999px; display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
  }
  .live i { width: 16px; height: 16px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 6px rgb(61 220 132 / .25); }

  .title {
    position: absolute; top: 300px; left: 72px; right: 72px;
    font-family: "Fredoka"; font-size: 104px; line-height: .94; color: var(--cream);
    text-shadow: 0 6px 0 rgb(49 22 10 / .28); letter-spacing: -1px;
  }
  .title span { color: var(--brown); text-shadow: none; }
  .sub { position: absolute; top: 520px; left: 76px; font-size: 32px; font-weight: 600; color: var(--sand); }

  /* Photos façon polaroïd */
  .photos { position: absolute; left: 0; right: 0; top: 590px; height: 520px; }
  .ph {
    position: absolute; background: var(--cream); padding: 14px 14px 18px; border-radius: 22px;
    box-shadow: 0 26px 50px -18px rgb(30 14 6 / .7);
  }
  .ph img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
  .ph.a { left: 64px;  top: 10px;  width: 400px; height: 500px; transform: rotate(-4deg); }
  .ph.b { left: 420px; top: 40px;  width: 300px; height: 380px; transform: rotate(3deg); z-index: 2; }
  .ph.c { left: 700px; top: 0;     width: 320px; height: 420px; transform: rotate(-2deg); }
  .ph.d { display: none; }
  .ph.d img { object-position: center 18%; }
  .tag {
    position: absolute; z-index: 3; font-family: "Fredoka"; font-size: 30px; line-height: 1.05; text-align: center;
    color: var(--brown); background: var(--sand); width: 190px; height: 190px; border-radius: 50%;
    display: grid; place-items: center; padding: 20px; transform: rotate(-12deg);
    box-shadow: 0 0 0 8px var(--brown), 0 18px 30px -10px rgb(30 14 6 / .6);
  }
  .tag.t1 { left: 820px; top: 360px; }

  /* Bas : où commander */
  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 232px; background: var(--brown); color: var(--cream); padding: 34px 72px 0; }
  .foot::before { /* bord ondulé */
    content: ""; position: absolute; left: 0; right: 0; top: -28px; height: 30px;
    background: radial-gradient(circle at 30px -2px, transparent 30px, var(--brown) 31px) 0 0 / 60px 30px repeat-x;
  }
  .url { font-family: "Fredoka"; font-size: 70px; line-height: 1; color: var(--sunset); }
  .wa { margin-top: 12px; font-size: 30px; font-weight: 600; display: flex; align-items: center; gap: 12px; }
  .wa svg { width: 34px; height: 34px; }
  .chips { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; }
  .chips b { font-size: 22px; font-weight: 700; color: var(--brown); background: var(--sand); border-radius: 999px; padding: 8px 18px; }
  .badge { position: absolute; right: 64px; bottom: 34px; width: 168px; border-radius: 50%; box-shadow: 0 0 0 6px var(--cream); }

  /* Variante story (1080 × 1920) */
  .story .head { top: 150px; }
  .story .title { top: 360px; font-size: 118px; }
  .story .sub { top: 610px; font-size: 36px; }
  .story .photos { top: 700px; height: 900px; }
  .story .ph.a { left: 56px;  top: 10px;  width: 520px; height: 660px; }
  .story .ph.b { left: 560px; top: 30px;  width: 460px; height: 420px; transform: rotate(4deg); }
  .story .ph.c { left: 600px; top: 470px; width: 420px; height: 420px; transform: rotate(-3deg); }
  .story .ph.d { display: block; left: 90px; top: 640px; width: 400px; height: 300px; transform: rotate(3deg); z-index: 2; }
  .story .tag.t1 { left: 470px; top: 400px; }
  .story .foot { height: 300px; padding-top: 52px; }
  .story .url { font-size: 84px; }

  /* Variante aperçu de lien (1200 × 630) */
  .og .poster { width: 1200px; height: 630px; }
  .og .head { top: 92px; left: 60px; right: auto; flex-direction: column; align-items: flex-start; gap: 18px; }
  .og .wordmark { width: 250px; }
  .og .live { font-size: 22px; padding: 10px 20px 8px; margin: 0; }
  .og .title { top: 296px; left: 60px; right: auto; width: 600px; font-size: 80px; }
  .og .sub { top: 468px; left: 64px; font-size: 24px; }
  .og .photos { top: 60px; left: 650px; right: 0; height: 480px; }
  .og .ph { padding: 10px 10px 14px; border-radius: 18px; }
  .og .ph.a { left: 0; top: 30px; width: 290px; height: 390px; }
  .og .ph.b { display: none; }
  .og .ph.c { left: 270px; top: 64px; width: 260px; height: 350px; transform: rotate(4deg); }
  .og .tag.t1 { left: 205px; top: 330px; width: 140px; height: 140px; font-size: 22px; padding: 14px; box-shadow: 0 0 0 6px var(--brown); }
  .og .foot { height: 86px; padding: 18px 60px 0; display: flex; align-items: center; gap: 36px; }
  .og .url { font-size: 46px; }
  .og .wa { margin: 0; font-size: 22px; }
  .og .wa svg { width: 26px; height: 26px; }
  .og .chips { display: none; }
  .og .badge { width: 104px; right: 48px; bottom: 14px; box-shadow: 0 0 0 5px var(--cream); }
</style>
</head>
<body>
<div class="poster">
  <svg class="lights" viewBox="0 0 1080 150" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 18 Q270 86 540 40 T1080 22" fill="none" stroke="#31160a" stroke-width="4" />
    <defs><radialGradient id="glow"><stop offset="0" stop-color="#fff6d8" stop-opacity=".95" /><stop offset="1" stop-color="#fde0af" stop-opacity="0" /></radialGradient></defs>
    <g fill="url(#glow)">
      <circle cx="120" cy="66" r="42" /><circle cx="300" cy="80" r="42" /><circle cx="480" cy="58" r="42" />
      <circle cx="650" cy="56" r="42" /><circle cx="820" cy="58" r="42" /><circle cx="980" cy="44" r="42" />
    </g>
    <g fill="#fff3cf" stroke="#31160a" stroke-width="3">
      <circle cx="120" cy="66" r="15" /><circle cx="300" cy="80" r="15" /><circle cx="480" cy="58" r="15" />
      <circle cx="650" cy="56" r="15" /><circle cx="820" cy="58" r="15" /><circle cx="980" cy="44" r="15" />
    </g>
  </svg>

  <div class="head">
    <img class="wordmark" src="../../public/brand/wordmark.webp" alt="Le QG" />
    <div class="live"><i></i>Ouvert en ligne</div>
  </div>

  <h1 class="title">Ton spot<br /><span>streetwear.</span></h1>
  <p class="sub">Dakar · nouveaux drops chaque semaine</p>

  <div class="photos">
    <figure class="ph a"><img src="photos/a.jpg" alt="" /></figure>
    <figure class="ph b"><img src="photos/b.jpg" alt="" /></figure>
    <figure class="ph c"><img src="photos/c.jpg" alt="" /></figure>
    <figure class="ph d"><img src="photos/d.jpg" alt="" /></figure>
    <div class="tag t1">Livré à Dakar en 24h</div>
  </div>

  <div class="foot">
    <div class="url">le-qg.store</div>
    <div class="wa">
      <svg viewBox="0 0 24 24" fill="#25d366" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3 0 .2 0 .8-.2 1.4Z"/></svg>
      Commande aussi sur WhatsApp : 78 928 53 88
    </div>
    <div class="chips"><b>Wave</b><b>Orange Money</b><b>Paiement à la livraison</b></div>
    <img class="badge" src="../../public/brand/badge.webp" alt="" />
  </div>
</div>
<script>
  const format = new URLSearchParams(location.search).get("format");
  if (format === "story" || format === "og") document.body.classList.add(format);
</script>
</body>
</html>
