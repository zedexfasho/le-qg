# Reconstruit le site avec le catalogue à jour (base D1) et le redéploie sur Cloudflare.
# Déclenché par le bouton « Publier le site » du dashboard, ou par un push sur main.
# Secrets GitHub nécessaires : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (voir README).
name: Publier le site

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets configurés ?
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets Cloudflare absents : publication ignorée (voir README, section Publication automatique)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installer
        if: steps.secrets.outputs.ok == 'true'
        run: npm ci

      - name: Récupérer le catalogue publié
        if: steps.secrets.outputs.ok == 'true'
        run: npm run catalog:pull

      - name: Tests
        if: steps.secrets.outputs.ok == 'true'
        run: npm test

      - name: Construire le site
        if: steps.secrets.outputs.ok == 'true'
        run: npm run build

      - name: Mettre la base à jour
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply le-qg-db --remote

      - name: Déployer
        if: steps.secrets.outputs.ok == 'true'
        run: npx wrangler deploy
